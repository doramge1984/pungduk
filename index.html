<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>2026 AI 행정혁신 거점학교 연수 · 풍덕고</title>
<style>
 :root{--blue:#1a4fb4;--blue-d:#12377f;--green:#1a9e6a;--ink:#1f2733;--line:#e3e8f0;--bg:#f4f6fb;--muted:#6b7688;}
 *{box-sizing:border-box}
 body{margin:0;font-family:'Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);font-size:20px;line-height:1.95;}
 .wrap{max-width:1080px;margin:0 auto;padding:0 16px 60px;}
 header.top{position:relative;overflow:hidden;background:linear-gradient(120deg,#121a2e 0%,#1c2842 55%,#243356 100%);color:#eef2f9;padding:32px 24px;border-radius:0 0 18px 18px;border-bottom:2px solid rgba(201,168,76,.55);box-shadow:0 6px 22px rgba(10,18,40,.32);}
 header.top::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 45%);pointer-events:none;}
 header.top>*{position:relative;z-index:1;}
 header.top .kicker{font-size:15px;letter-spacing:.10em;color:#cdb478;margin:0 0 9px;font-weight:700;}
 header.top h1{margin:0;font-size:31px;font-weight:800;letter-spacing:-.01em;color:#e4c778;text-shadow:0 1px 10px rgba(201,168,76,.18);}
 header.top .sub{margin:11px 0 0;font-size:17px;color:#c3cde0;}
 .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 18px;}
 .tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:13px 18px;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s;}
 .tab:hover:not(.active){border-color:#9aa4b5;}
 .tab.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 12px rgba(30,50,90,.18);}
 .tab.active[data-tab="home"]{background:#1c2842;border-color:#1c2842;}
 .tab.active[data-tab="1"]{background:#4a6a9c;border-color:#4a6a9c;}
 .tab.active[data-tab="2"]{background:#4f8067;border-color:#4f8067;}
 .tab.active[data-tab="3"]{background:#6f5c9c;border-color:#6f5c9c;}
 .tab.active[data-tab="4"]{background:#a8842f;border-color:#a8842f;}
 .tab.active[data-tab="5"]{background:#9c5f74;border-color:#9c5f74;}
 .tab.active[data-tab="gift"]{background:linear-gradient(135deg,#c9a84c,#a8842f);border-color:#a8842f;color:#fff;}
 .tab .tab-date{font-size:13px;font-weight:600;opacity:.75;margin-left:3px;}
 .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 34px;box-shadow:0 2px 10px rgba(20,40,90,.05);min-height:340px;}
 .s-title{font-size:33px;margin:2px 0 6px;color:var(--blue-d);font-weight:800;line-height:1.35;}
 .s-sub{margin:0 0 16px;color:var(--muted);font-size:20.5px;}
 .s-meta{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:18px;color:#3c4652;background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:15px 18px;margin-bottom:8px;}
 h3.blk{font-size:23px;margin:52px 0 18px;padding-left:13px;border-left:5px solid var(--green);}
 .block{border:1px solid var(--line);border-radius:12px;margin-bottom:64px;overflow:hidden;}
 .block-head{display:flex;align-items:center;gap:12px;background:#eef3fb;padding:16px 18px;cursor:pointer;user-select:none;transition:background .15s;}
 .block-head:hover{background:#e3ebf9;}
 .block.open .block-head{background:#dfe9fb;border-bottom:1px solid #cdddf5;}
 .block-n{background:var(--blue);color:#fff;font-size:16px;font-weight:800;border-radius:6px;padding:5px 12px;white-space:nowrap;}
 .block-t{font-weight:800;font-size:21px;color:var(--blue-d);flex:1;line-height:1.4;}
 .block-h{font-size:14px;color:var(--muted);font-weight:700;}
 .chev{font-size:20px;color:var(--blue);font-weight:900;transition:transform .2s;line-height:1;}
 .block.open .chev{transform:rotate(180deg);}
 .block-body{display:none;}
 .block.open .block-body{display:block;}
 .block-ul{margin:0;padding:20px 22px 8px 40px;} .block-ul li{margin:16px 0;font-size:19px;line-height:1.75;}
 .item-detail{margin:26px 0;} .item-label{font-weight:800;color:var(--ink);}
 .item-detail.coll{margin:46px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 3px 14px rgba(40,60,100,.09);}
 .item-detail.coll:first-child{margin-top:20px;}
 .item-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:15px 16px;background:#f7f9fd;font-size:19.5px;}
 .item-toggle:hover{background:#eef3fb;}
 .item-detail.coll.open .item-toggle{background:#eef3fb;border-bottom:1px solid var(--line);}
 .item-toggle .ichev{margin-left:auto;color:var(--blue);font-size:18px;transition:transform .2s;}
 .item-detail.coll.open .ichev{transform:rotate(180deg);}
 .item-detail.coll .item-body{display:none;padding:6px 14px 10px;}
 .item-detail.coll.open .item-body{display:block;}
 .item-detail.coll-green{border-color:#bce8d2;}
 .item-detail.coll-green .item-toggle{background:#eafaf1;}
 .item-detail.coll-green .item-toggle:hover{background:#dff3e8;}
 .item-detail.coll-green.open .item-toggle{background:#dff3e8;border-bottom-color:#bce8d2;}
 .item-detail.coll-green .item-body{background:#f6fcf9;}
 .item-detail.coll-red{border-color:#f3c4c0;}
 .item-detail.coll-red .item-toggle{background:#fdecec;}
 .item-detail.coll-red .item-toggle:hover{background:#fbdedd;}
 .item-detail.coll-red.open .item-toggle{background:#fbdedd;border-bottom-color:#f3c4c0;}
 .item-detail.coll-red .item-body{background:#fffafa;}
 .steps{margin:12px 0 6px;padding-left:26px;counter-reset:st;}
 .steps li{margin:12px 0;font-size:18px;line-height:1.75;color:#33404f;}
 .item-note{margin:8px 0 2px;font-size:16px;color:#8a94a4;}
 .item-lead{margin:4px 0 10px;font-size:18px;line-height:1.75;color:#33404f;}
 /* roomy: 특정 차시만 간격 넓게 — 내용 바뀔때 2줄+, 큰주제 바뀔때 5줄+ */
 .block.roomy .steps li{margin:46px 0;}
 .block.roomy .steps{margin:26px 0 14px;}
 .block.roomy .item-lead{margin:8px 0 32px;}
 .block.roomy .item-note{margin:40px 0 6px;}
 .block.roomy .item-body{padding:20px 16px 28px;}
 .block.roomy .item-detail.coll{margin:58px 0;}
 .block.roomy .item-detail.coll:first-child{margin-top:22px;}
 .block.roomy .item-detail.coll.open{margin-bottom:120px;}
 .img-slot{border:2px dashed #b9c6de;border-radius:12px;background:#fbfdff;padding:26px 16px;text-align:center;color:#8a94a4;font-size:14.5px;margin:10px 0;}
 .img-slot b{display:block;color:#5b6472;font-size:16px;margin-bottom:4px;}
 .doc-img{display:block;max-width:100%;height:auto;margin:14px 0 60px;border:1px solid #e3e8f0;border-radius:12px;box-shadow:0 3px 12px rgba(40,60,100,.10);}
 .setup{margin:8px 0 40px;border:1px solid #d9c9a0;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(40,60,100,.08);}
 .setup-head{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1c2842,#2a3a60);color:#e4c778;padding:17px 20px;font-size:20px;font-weight:800;cursor:pointer;user-select:none;flex-wrap:wrap;}
 .setup-head .setup-sub{font-size:14.5px;font-weight:600;color:#b7c2d6;}
 .setup-head .chev{margin-left:auto;color:#e4c778;transition:transform .2s;}
 .setup.open .setup-head .chev{transform:rotate(180deg);}
 .setup-body{display:none;padding:20px 22px;background:#fbfcfe;}
 .setup.open .setup-body{display:block;}
 .setup-intro{margin:0 0 18px;font-size:17.5px;line-height:1.7;color:#33404f;background:#eef4ff;border:1px solid #d7e5fb;border-radius:10px;padding:14px 16px;}
 .step{border:1px solid #e6ddc3;border-left:4px solid #c9a84c;border-radius:10px;padding:16px 18px 18px;margin:16px 0;background:#fff;}
 .step.step-red{background:#fff5f5;border-color:#f3c4c0;border-left-color:#e05a4a;}
 .step-badge{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.05em;color:#fff;background:linear-gradient(135deg,#c9a84c,#a8842f);padding:4px 12px;border-radius:20px;margin-bottom:10px;}
 .step-title{font-size:19px;font-weight:800;color:#1f2733;margin-bottom:12px;line-height:1.4;}
 .step-lead{margin:0 0 12px;font-size:16.5px;line-height:1.7;color:#3a4250;}
 .click-here{font-size:15px;font-weight:800;color:#c0392b;}
 .mini-toggle{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:#f2f5fb;border:1px solid #dbe4f1;color:#3a4250;border-radius:8px;padding:9px 15px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
 .mini-toggle:hover{border-color:#c9a84c;}
 .mini-toggle .mchev{color:#a8842f;font-size:14px;}
 .mini-body{display:none;margin-top:12px;font-size:16px;line-height:1.75;color:#3a4250;}
 .mini-body.show{display:block;}
 .mini-body ul{margin:8px 0 0;padding-left:22px;} .mini-body li{margin:6px 0;} .mini-body p{margin:0 0 8px;}
 .warn{background:#fff5f5;border:1px solid #f3c4c0;border-radius:8px;padding:11px 14px;color:#a5372f;font-size:15.5px;line-height:1.7;margin-top:12px;}
 .game-flip{margin:36px 0 90px;perspective:1000px;}
 .game-cover{cursor:pointer;border-radius:18px;padding:44px 24px;text-align:center;color:#fff;box-shadow:0 8px 26px rgba(40,60,100,.2);transition:transform .2s;position:relative;overflow:hidden;}
 .game-cover:hover{transform:translateY(-4px);}
 .game-cover::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.16),rgba(255,255,255,0) 60%);pointer-events:none;}
 .game-cover.cov1{background:linear-gradient(140deg,#3b6fe0,#7a5cf0);}
 .game-cover.cov2{background:linear-gradient(140deg,#f0902a,#e0542a);}
 .cover-badge{display:inline-block;font-size:14px;font-weight:900;letter-spacing:.08em;background:rgba(255,255,255,.22);padding:5px 15px;border-radius:20px;margin-bottom:12px;}
 .cover-emoji{font-size:66px;line-height:1;margin:6px 0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18));}
 .cover-title{font-size:27px;font-weight:900;margin-bottom:12px;}
 .cover-hint{font-size:16.5px;font-weight:800;opacity:.96;}
 .game-content{display:none;}
 .game-flip.flipped .game-cover{display:none;}
 .game-flip.flipped .game-content{display:block;animation:flipin .5s ease;}
 .game-content .game.arcade{margin:0;}
 @keyframes flipin{0%{transform:perspective(900px) rotateY(-90deg);opacity:0}100%{transform:perspective(900px) rotateY(0);opacity:1}}
 .level-row{display:flex;gap:10px;margin:2px 0 16px;flex-wrap:wrap;}
 .level-btn{background:#eef1f7;border:2px solid transparent;color:#3a4250;border-radius:12px;padding:10px 18px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;}
 .level-btn:hover{background:#e4e9f3;}
 .level-btn.active{background:linear-gradient(135deg,#3b6fe0,#7a5cf0);color:#fff;box-shadow:0 3px 10px rgba(90,92,240,.28);}
 .g1-src{display:none;width:100%;min-height:110px;padding:14px 16px;border:2px solid #cfd8e6;border-radius:12px;font-size:16.5px;font-family:inherit;line-height:1.7;margin-bottom:14px;resize:vertical;background:#fbfdff;}
 .g1-src:focus{outline:none;border-color:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.14);}
 .g1-inst{font-size:18px !important;background:linear-gradient(135deg,#eef4ff,#e3ecfb) !important;border-color:#b9cdef !important;color:#1f3a68 !important;}
 .cap-emoji-only{justify-content:center;}
 .cap-emoji-only .cap-emoji{font-size:96px;}
 .game.arcade{position:relative;border:0;border-radius:18px;padding:26px 24px;margin:24px 0;background:linear-gradient(160deg,#ffffff,#f5f8fd);box-shadow:0 8px 26px rgba(40,60,100,.13);overflow:hidden;}
 .game.arcade::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899,#f59e0b,#10b981);}
 .arcade-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 6px;}
 .arcade-badge{font-size:13px;font-weight:900;letter-spacing:.05em;color:#fff;background:linear-gradient(135deg,#1c2842,#3b4d78);padding:5px 13px;border-radius:8px;box-shadow:0 2px 6px rgba(28,40,66,.25);}
 .arcade-title{font-size:23px;font-weight:900;color:#1f2733;}
 .arcade-keys{margin-left:auto;}
 .game-desc{margin:2px 0 18px;font-size:16.5px;line-height:1.75;color:#3a4250;}
 .game-hint{font-size:14.5px;font-weight:600;color:#6b7688;}
 .mode-row{display:flex;gap:8px;margin:2px 0 18px;}
 .mode-btn{background:#eef1f7;border:2px solid transparent;color:#3a4250;border-radius:24px;padding:9px 22px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;}
 .mode-btn:hover{background:#e4e9f3;}
 .mode-btn.active{background:linear-gradient(135deg,#f59e0b,#e0724a);color:#fff;box-shadow:0 3px 10px rgba(224,114,74,.3);}
 .stage-row{display:flex;align-items:center;gap:12px;margin:10px 0 20px;}
 .dots{display:inline-flex;gap:8px;}
 .dot{width:15px;height:15px;border-radius:50%;background:#dfe4ee;box-shadow:inset 0 1px 2px rgba(0,0,0,.08);transition:.2s;}
 .dot.done{background:linear-gradient(135deg,#10b981,#059e6a);}
 .dot.cur{background:#f59e0b;box-shadow:0 0 0 5px rgba(245,158,11,.18);animation:dotpulse 1.1s infinite;}
 @keyframes dotpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
 .stage-label{font-size:14px;font-weight:900;color:#a8842f;letter-spacing:.03em;}
 .g1-target{background:linear-gradient(135deg,#fffdf3,#fff4d0);border:2px dashed #e0c86a;border-radius:16px;padding:24px 18px;font-size:24px;font-weight:800;color:#2a2a2a;text-align:center;margin-bottom:14px;user-select:all;box-shadow:inset 0 2px 10px rgba(224,200,106,.18);}
 .game-start{background:linear-gradient(135deg,#f59e0b,#e0724a);color:#fff;border:0;border-radius:24px;padding:13px 26px;font-size:16.5px;font-weight:900;cursor:pointer;font-family:inherit;margin-bottom:12px;box-shadow:0 4px 12px rgba(224,114,74,.32);}
 .game-start:hover{filter:brightness(1.05);}
 .game-start.hidden{display:none;}
 .game-input{width:100%;padding:15px 16px;border:2px solid #cfd8e6;border-radius:12px;font-size:17px;font-family:inherit;transition:.15s;}
 .game-input:focus{outline:none;border-color:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.14);}
 .paste-zone{min-height:130px;border:2px dashed #b9c6de;border-radius:14px;background:#fbfdff;display:flex;align-items:center;justify-content:center;text-align:center;color:#8a94a4;font-size:16px;padding:16px;cursor:text;transition:.15s;}
 .paste-zone:focus{outline:none;border-color:#f59e0b;background:#fffdf3;}
 .paste-zone img{max-width:100%;max-height:320px;border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.15);}
 .game-result{margin-top:20px;font-size:18px;font-weight:800;min-height:26px;}
 .game-result.big{font-size:23px;}
 .game-result.ok{color:#0f9d63;} .game-result.bad{color:#e0524a;}
 .best{margin-top:8px;font-size:15.5px;font-weight:800;color:#a8842f;}
 .game-intro{background:linear-gradient(135deg,#fff6e6,#ffeccf);border:1px solid #f2d9a8;border-radius:12px;padding:14px 18px;font-size:16.5px;color:#7a5b12;margin:4px 0 18px;font-weight:600;}
 .cap-card{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#eef4ff,#e5ecfb);border:2px solid #b9cdef;border-radius:16px;padding:22px;margin-bottom:10px;box-shadow:0 4px 14px rgba(60,90,160,.12);}
 .cap-emoji{font-size:62px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12));}
 .cap-lines{font-size:19px;line-height:1.6;color:#2a2a2a;font-weight:700;}
 .cap-lines .cap-ar{font-size:21px;}
 .cap-note{margin:2px 0 12px;font-size:14.5px;color:#3a4250;background:#eef4ff;border:1px solid #d7e5fb;border-radius:8px;padding:10px 13px;line-height:1.6;}
 .sheet-embed{width:100%;height:440px;border:1px solid #e3e8f0;border-radius:12px;margin-top:14px;background:#fff;}
 .doc-embed{width:100%;height:520px;border:1px solid #e3e8f0;border-radius:12px;margin-top:8px;background:#fff;}
 .padlet-embed{width:100%;height:520px;border:1px solid #e3e8f0;border-radius:12px;margin-top:12px;background:#fff;}
 .embed-note{margin:10px 0 2px;font-size:14.5px;color:#6b7688;line-height:1.6;}
 @media(max-width:560px){.cap-card{flex-direction:column;text-align:center;}.sheet-embed{height:360px;}.doc-embed{height:440px;}.arcade-keys{margin-left:0;width:100%;}}
 .gkeys{margin:6px 0 16px !important;max-width:540px;}
 .faces-btn{margin-top:-44px !important;margin-bottom:52px !important;}
 .check-list{margin:8px 0 4px;display:flex;flex-direction:column;gap:9px;}
 .check-item{background:#eafaf1;border:1px solid #bce8d2;border-radius:10px;padding:12px 15px;font-size:16.5px;color:#166b47;font-weight:600;}
 .setup-intro{margin:0 0 18px;font-size:17.5px;line-height:1.7;color:#33404f;background:#eef4ff;border:1px solid #d7e5fb;border-radius:10px;padding:14px 16px;}
 .tab.active[data-tab="setup"]{background:linear-gradient(135deg,#2a3a60,#1c2842);border-color:#1c2842;color:#e4c778;}
 .tab.active[data-tab="warmup"]{background:linear-gradient(135deg,#e0724a,#d1522a);border-color:#d1522a;color:#fff;}
 .block-body a:not(.copy-btn){color:var(--blue);font-weight:700;word-break:break-all;}
 .copy-btn{display:inline-flex;align-items:center;gap:8px;margin:48px 0 22px;background:#1a9e6a;color:#fff !important;text-decoration:none;font-weight:800;font-size:18px;padding:14px 24px;border-radius:10px;box-shadow:0 2px 8px rgba(26,158,106,.25);}
 .copy-btn:hover{background:#158a5a;}
 .cta-desc{margin:0 0 12px;font-size:16px;line-height:1.7;color:#48525f;background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:13px 16px;}
 .link-btn{display:inline-flex;align-items:center;gap:8px;margin:10px 0 4px;background:var(--blue);color:#fff !important;text-decoration:none;font-weight:800;font-size:17.5px;padding:12px 20px;border-radius:10px;box-shadow:0 2px 8px rgba(26,79,180,.22);}
 .link-btn:hover{background:var(--blue-d);}
 .prompt-wrap{margin:22px 0 6px;border:1px solid #dbe4f1;border-radius:10px;overflow:hidden;}
 .prompt-head{font-weight:800;color:var(--blue-d);font-size:18px;padding:14px 16px;background:#eef3fb;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;}
 .prompt-head:hover{background:#e3ebf9;}
 .pchev{margin-left:auto;font-size:18px;color:var(--blue);transition:transform .2s;}
 .prompt-wrap.open .pchev{transform:rotate(180deg);}
 .prompt-body{display:none;padding:8px 14px 14px;}
 .prompt-wrap.open .prompt-body{display:block;}
 .prompt-inline{margin:12px 0 4px;}
 .tip-wrap{padding:0 !important;overflow:hidden;}
 .tip-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:14px 18px;font-weight:800;}
 .tip-head:hover{filter:brightness(.98);}
 .tip-wrap .pchev{margin-left:auto;color:#d98a12;}
 .tip-body{display:none;padding:0 18px 16px;}
 .tip-wrap.open .tip-body{display:block;}
 .prompt-card{display:flex;align-items:center;gap:12px;background:#f7f9fc;border:1px solid #e3e8f0;border-radius:10px;padding:13px 15px;margin:12px 0;}
 .prompt-num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;}
 .prompt-text{flex:1;font-size:18px;line-height:1.6;color:var(--ink);}
 .pcopy{flex:none;background:#fff;border:1.5px solid var(--blue);color:var(--blue);font-weight:800;font-size:16px;padding:10px 18px;border-radius:8px;cursor:pointer;white-space:nowrap;}
 .pcopy:hover{background:var(--blue);color:#fff;}
 .pcopy.done{background:var(--green);border-color:var(--green);color:#fff;}

 .concept{background:#eef6ff;border:1px solid #d3e6fb;border-radius:12px;padding:18px 22px;margin:8px 0 30px;font-size:18.5px;line-height:1.85;}
 .practice{margin:44px 22px 6px;padding:14px 18px;background:#eafaf1;border-left:5px solid #1a9e6a;border-radius:8px;font-size:18px;line-height:1.75;}
 .tip{margin:36px 22px 20px;padding:13px 18px;background:#fff5e9;border-left:5px solid #d98a12;border-radius:8px;font-size:17px;color:#7a5b12;line-height:1.7;}
 .practice b,.tip b{margin-right:6px;}
 .files-ul{margin:8px 0 0;padding-left:24px;} .files-ul li{margin:9px 0;font-size:18px;line-height:1.6;}
 .fill-box{margin-top:52px;border:1.5px dashed #b9c6de;border-radius:12px;background:#fbfdff;padding:22px 22px;}
 .fill-title{font-weight:800;color:var(--blue-d);font-size:18px;margin-bottom:6px;}
 .fill-desc{margin:0;font-size:17.5px;color:var(--muted);line-height:1.7;}
 .home-lead{background:#eef6ff;border:1px solid #d3e6fb;border-radius:12px;padding:20px 22px;margin:4px 0 30px;font-size:19px;line-height:1.8;}
 .day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
 .day-card{position:relative;border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;background:#fff;transition:.18s ease;box-shadow:0 2px 10px rgba(40,60,100,.07),inset 0 1px 0 rgba(255,255,255,.65);overflow:hidden;}
 .day-card::after{content:"";position:absolute;top:-40%;left:-30%;width:60%;height:180%;background:linear-gradient(115deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);transform:skewX(-18deg);opacity:0;transition:.5s ease;pointer-events:none;}
 .day-card:hover{box-shadow:0 12px 26px rgba(30,50,90,.17),inset 0 1px 0 rgba(255,255,255,.7);transform:translateY(-3px);}
 .day-card:hover::after{opacity:.9;left:120%;}
 .dc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
 .dc-no{font-size:16.5px;font-weight:800;color:var(--blue);}
 .dc-date{font-size:15px;color:var(--muted);}
 .dc-title{font-size:21px;font-weight:800;color:var(--ink);margin:4px 0 6px;line-height:1.4;}
 .dc-sub{font-size:16.5px;color:var(--muted);line-height:1.55;min-height:44px;}
 .dc-badge{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:700;padding:6px 14px;border-radius:20px;}
 .badge-open{background:#e7f7ee;color:#158a5a;border:1px solid #bce8d2;}
 .badge-lock{background:#f1f3f7;color:#8a94a4;border:1px solid #e0e5ee;}
 .day-card.locked .dc-title{color:#5b6472;}
 .day-card.d1{background:linear-gradient(135deg,#eef1f7 0%,#dbe3ef 60%,#c6d3e6 100%);border-color:#adbcd4;border-left:5px solid #4a6a9c;}
 .day-card.d1 .dc-no{color:#3f5c88;}
 .day-card.d2{background:linear-gradient(135deg,#eef4ef 0%,#dae7de 60%,#c4d8ca 100%);border-color:#aac2b3;border-left:5px solid #4f8067;}
 .day-card.d2 .dc-no{color:#437057;}
 .day-card.d3{background:linear-gradient(135deg,#f1eef7 0%,#e2dbee 60%,#cfc4e2 100%);border-color:#bcb0d6;border-left:5px solid #6f5c9c;}
 .day-card.d3 .dc-no{color:#5f4d8a;}
 .day-card.d4{background:linear-gradient(135deg,#f6f0e4 0%,#ece0c7 60%,#ddcca6 100%);border-color:#cbb890;border-left:5px solid #a8842f;}
 .day-card.d4 .dc-no{color:#8a6a25;}
 .day-card.d5{background:linear-gradient(135deg,#f5eef1 0%,#e9dae0 60%,#d8bfc9 100%);border-color:#cbafba;border-left:5px solid #9c5f74;}
 .day-card.d5 .dc-no{color:#844f63;}
 .day-card.dgift{background:linear-gradient(135deg,#efe4c2 0%,#dcc689 50%,#c9a84c 100%);border-color:#b8912f;border-left:5px solid #a8842f;}
 .day-card.dgift .dc-no{color:#6e5518;}
 .day-card.dgift .dc-title,.day-card.dgift .dc-sub,.day-card.dgift .dc-date{color:#54410f;}
 .lock-screen{text-align:center;padding:44px 16px;}
 .lock-screen .big{font-size:60px;margin-bottom:10px;}
 .lock-screen h2{font-size:27px;margin:0 0 8px;color:var(--blue-d);line-height:1.4;}
 .lock-screen p{color:var(--muted);font-size:18.5px;margin:0 0 24px;}
 .pw-row{display:flex;gap:10px;justify-content:center;max-width:400px;margin:0 auto;}
 .pw-row input{flex:1;padding:15px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;}
 .pw-row input:focus{outline:none;border-color:var(--blue);}
 .pw-row button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:15px 26px;font-size:18px;font-weight:700;cursor:pointer;}
 .pw-row button:hover{background:var(--blue-d);}
 .pw-err{color:#c0392b;font-size:16px;margin-top:14px;min-height:20px;}
 .backhome{display:inline-block;margin-bottom:18px;font-size:17px;color:var(--blue);cursor:pointer;font-weight:700;}
 footer{margin-top:34px;text-align:center;color:var(--muted);font-size:14px;}
 .admin-hint{margin-top:10px;font-size:14px;color:#9aa6b6;}
 .gift-table{width:100%;border-collapse:collapse;font-size:18px;margin:6px 0 10px;}
 .gift-table th,.gift-table td{border:1px solid var(--line);padding:12px 14px;text-align:left;vertical-align:top;}
 .gift-table th{background:#eef3fb;font-weight:800;color:var(--blue-d);}
 .gift-table td:first-child{white-space:nowrap;}
 kbd{display:inline-block;background:#1f2733;color:#fff;border-radius:6px;padding:5px 11px;font-size:16px;font-weight:700;font-family:inherit;white-space:nowrap;}
 .gift-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:6px 0 10px;}
 .gift-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;background:#fff;transition:.15s;}
 .gift-card:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(20,50,120,.08);}
 .gc-emoji{font-size:24px;flex:none;}
 .gc-body{display:flex;flex-direction:column;flex:1;min-width:0;}
 .gc-title{font-weight:800;color:var(--ink);font-size:17.5px;line-height:1.35;}
 .gc-url{color:var(--muted);font-size:15px;word-break:break-all;}
 .gc-ext{color:var(--blue);font-size:18px;flex:none;font-weight:800;}
 .gem-intro{background:#eef6ff;border:1px solid #d3e6fb;border-radius:10px;padding:14px 16px;font-size:17.5px;line-height:1.75;margin:6px 0 14px;}
 .gem-step{display:flex;gap:14px;align-items:flex-start;margin:14px 0;font-size:18px;line-height:1.7;}
 .gem-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;}
 .gem-note{margin-top:16px;background:#fff8e8;border:1px solid #f0dfae;border-radius:10px;padding:14px 16px;font-size:17px;color:#7a5b12;line-height:1.75;}
 h3.gift-blk{margin-top:96px;}
 h3.gift-blk:first-of-type{margin-top:48px;}
 .gift-closing{margin-top:96px;text-align:center;background:#eafaf1;border:1px solid #bce8d2;border-radius:14px;padding:28px 20px;font-size:18.5px;line-height:1.85;color:#166b47;}
 .gift-closing .gc-icon{font-size:42px;margin-bottom:6px;}
 .instructor{margin:2px 0 96px;}
 .ins-banner{position:relative;overflow:hidden;background:linear-gradient(135deg,#141d33 0%,#1e2b4a 60%,#26365c 100%);border:1px solid #33436a;border-top:3px solid #c9a84c;border-radius:16px;padding:26px 28px;box-shadow:0 10px 30px rgba(12,20,44,.22);}
 .ins-banner::after{content:"";position:absolute;top:-40%;right:-4%;width:36%;height:180%;background:linear-gradient(115deg,rgba(255,255,255,0),rgba(201,168,76,.16) 50%,rgba(255,255,255,0));transform:skewX(-16deg);pointer-events:none;}
 .ins-kicker{position:relative;z-index:1;font-size:13px;letter-spacing:.14em;color:#cdb478;font-weight:800;margin-bottom:8px;}
 .ins-name{position:relative;z-index:1;font-size:28px;font-weight:800;color:#e4c778;line-height:1.15;}
 .ins-name span{font-size:17px;color:#aeb9cf;font-weight:600;margin-left:9px;font-style:italic;}
 .ins-chips{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:9px;margin-top:16px;}
 .ins-chip{background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.4);color:#dce4f1;border-radius:22px;padding:8px 15px;font-size:14.5px;font-weight:600;}
 .ins-chip b{color:#e4c778;}
 .ins-div{position:relative;z-index:1;height:1px;background:linear-gradient(90deg,rgba(201,168,76,.5),rgba(201,168,76,0));margin:18px 0;}
 .ins-contact{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px;}
 .ins-pill{background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.4);color:#e4c778 !important;border-radius:22px;padding:9px 16px;font-size:15px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
 .ins-pill:hover{background:rgba(201,168,76,.16);}
 .ins-cta{background:linear-gradient(135deg,#e0c375,#c9a84c);border-color:#c9a84c;color:#1c2842 !important;}
 .ins-cta:hover{filter:brightness(1.05);background:linear-gradient(135deg,#e7ce86,#d0af52);}
 .ins-toggle{margin-top:12px;width:100%;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e6ddc3;border-radius:12px;padding:15px 20px;font-size:16.5px;font-weight:800;color:#3a4250;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(40,60,100,.06);transition:.15s;}
 .ins-toggle:hover{border-color:#c9a84c;}
 .ins-plus{color:#c9a84c;font-size:22px;font-weight:800;line-height:1;transition:transform .2s;}
 .instructor.open .ins-plus{transform:rotate(45deg);}
 .ins-tag{margin-left:auto;font-size:13px;font-weight:800;color:#a8842f;background:#f7edcf;border:1px solid #eaddb0;border-radius:16px;padding:5px 12px;}
 .ins-more{display:none;}
 .instructor.open .ins-more{display:block;}
 .ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 34px;margin-top:12px;background:linear-gradient(140deg,#141d33,#1e2b4a 60%,#243356);border:1px solid #33436a;border-radius:14px;padding:24px 26px;}
 .ins-col.ins-wide{grid-column:1 / -1;}
 .ins-col h4{margin:0 0 10px;font-size:16px;color:#e4c778;border-bottom:1px solid #3a4a70;padding-bottom:7px;font-weight:800;}
 .ins-col ul{margin:0;padding-left:18px;}
 .ins-col li{margin:7px 0;font-size:15.5px;line-height:1.6;color:#ccd6e6;}
 .ins-col li b{color:#ecd693;font-weight:700;}
 @media(max-width:560px){.ins-grid{grid-template-columns:1fr;}.ins-col.ins-wide{grid-column:auto;}}
 @media(max-width:560px){header.top h1{font-size:26px}.panel{padding:22px 16px}.s-title{font-size:28px}.block-t{font-size:19px}.block-ul li{font-size:18px}.item-toggle{font-size:18px}.steps li{font-size:17px}.gift-table{font-size:16px}.gift-cards{grid-template-columns:1fr}}

/* ===== 마장 캘린더(cal-embed) 스코프 스타일 ===== */
.cal-embed * { margin: 0; padding: 0; box-sizing: border-box; }
.cal-embed body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #F8F9FA;
            color: #202124;
            min-height: 100vh;
            zoom: 1.6;
        }
.cal-embed .header {
            background: linear-gradient(135deg, #0d1b2a 0%, #1a2c45 60%, #0f3460 100%);
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.35);
        }
.cal-embed .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 52px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
.cal-embed .logo-wrap { display: flex; align-items: center; gap: 14px; }
.cal-embed .g-dots { display: flex; gap: 5px; }
.cal-embed .g-dot {
            width: 11px; height: 11px; border-radius: 50%;
        }
.cal-embed .header-title {
            font-size: 27px; font-weight: 700; letter-spacing: -0.3px;
        }
.cal-embed .header-sub {
            font-size: 15px; opacity: 0.6; font-weight: 300; margin-top: 2px;
        }
.cal-embed .gemini-badge {
            background: linear-gradient(135deg, #4285F4, #8B5CF6);
            padding: 7px 18px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.4px;
        }
.cal-embed .tab-nav {
            display: flex;
            padding: 0 52px;
            overflow-x: auto;
            scrollbar-width: none;
        }
.cal-embed .tab-nav::-webkit-scrollbar { display: none; }
.cal-embed .tab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 15px 22px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: rgba(255,255,255,0.55);
            font-family: inherit;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: color .2s, border-color .2s, background .2s;
        }
.cal-embed .tab-btn:hover { color: white; background: rgba(255,255,255,0.07); }
.cal-embed .tab-btn.active { color: white; border-bottom-color: #4285F4; }
.cal-embed .tab-emoji { font-size: 18px; }
.cal-embed .main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 44px 28px 80px;
        }
.cal-embed .tab-content { display: none; }
.cal-embed .tab-content.active {
            animation: fadeUp .3s ease;
        }
@keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
.cal-embed .section-header { margin-bottom: 32px; }
.cal-embed .s-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
.cal-embed .s-title {
            font-size: 37px;
            font-weight: 700;
            color: #202124;
            line-height: 1.25;
            margin-bottom: 8px;
        }
.cal-embed .s-desc {
            font-size: 18px;
            color: #5F6368;
            line-height: 1.7;
        }
.cal-embed .obj-card {
            display: flex;
            align-items: center;
            gap: 18px;
            background: white;
            border-radius: 16px;
            padding: 22px 28px;
            margin-bottom: 30px;
            border-left: 4px solid #4285F4;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
        }
.cal-embed .obj-icon { font-size: 41px; flex-shrink: 0; }
.cal-embed .obj-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #4285F4;
            margin-bottom: 5px;
        }
.cal-embed .obj-text { font-size: 20px; font-weight: 500; line-height: 1.5; }
.cal-embed .steps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(295px, 1fr));
            gap: 18px;
            margin-bottom: 32px;
        }
.cal-embed .step-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
            transition: box-shadow .2s, transform .2s;
        }
.cal-embed .step-card:hover {
            box-shadow: 0 6px 22px rgba(0,0,0,0.12);
            transform: translateY(-2px);
        }
.cal-embed .step-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
        }
.cal-embed .bc-blue::before { background: #4285F4; }
.cal-embed .bc-red::before { background: #EA4335; }
.cal-embed .bc-yellow::before { background: #FBBC04; }
.cal-embed .bc-green::before { background: #34A853; }
.cal-embed .bc-purple::before { background: #8B5CF6; }
.cal-embed .step-num {
            width: 34px; height: 34px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; font-weight: 700; color: white;
            margin-bottom: 14px;
        }
.cal-embed .bg-blue { background: #4285F4; }
.cal-embed .bg-red { background: #EA4335; }
.cal-embed .bg-yellow { background: #FBBC04; color: #202124 !important; }
.cal-embed .bg-green { background: #34A853; }
.cal-embed .bg-purple { background: #8B5CF6; }
.cal-embed .step-title {
            font-size: 20px; font-weight: 600;
            color: #202124; margin-bottom: 9px;
            display: flex; align-items: center; gap: 8px;
        }
.cal-embed .step-body {
            font-size: 17px; color: #5F6368; line-height: 1.75;
        }
.cal-embed .step-tags {
            display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px;
        }
.cal-embed .tag {
            padding: 3px 11px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
        }
.cal-embed .t-blue { background: #E8F0FE; color: #1967D2; }
.cal-embed .t-red { background: #FCE8E6; color: #C5221F; }
.cal-embed .t-yellow { background: #FEF7E0; color: #B06000; }
.cal-embed .t-green { background: #E6F4EA; color: #137333; }
.cal-embed .t-purple { background: #EDE7F6; color: #6200EA; }
.cal-embed .t-gray { background: #F1F3F4; color: #3C4043; }
.cal-embed .opt {
            display: inline-flex; align-items: center; gap: 4px;

        }
.cal-embed .info-box {
            display: flex; gap: 16px; align-items: flex-start;
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 24px;
        }
.cal-embed .ib-blue { background: #E8F0FE; }
.cal-embed .ib-yellow { background: #FEF7E0; }
.cal-embed .ib-green { background: #E6F4EA; }
.cal-embed .ib-red { background: #FCE8E6; }
.cal-embed .ib-purple { background: #EDE7F6; }
.cal-embed .info-icon { font-size: 29px; flex-shrink: 0; }
.cal-embed .info-box h4 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.cal-embed .info-box p { font-size: 20px; color: #5F6368; line-height: 1.65; }
.cal-embed .perm-wrap { margin-bottom: 30px; }
.cal-embed .perm-wrap h2 { font-size: 21px; font-weight: 700; margin-bottom: 14px; }
.cal-embed .perm-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
        }

            background: #202124;

.cal-embed .shortcut-box {

const P={"open": {"1": "<h2 class=\"s-title\">1일차 · 칼퇴 요정의 AI 비법서</h2>\n<p class=\"s-sub\">현장 공무원이 몰랐던 디지털 꿀팁 실습</p>\n<div class=\"s-meta\">\n  <span>📅 7. 29. (수)</span><span>⏱️ 3시간 (오전 A반 10:00~13:00 / 오후 B반 14:00~17:00)</span>\n  <span>📍 홍천고</span><span>👤 강사 플로우디엑스 · 이애진 대표</span>\n</div>\n<div class=\"concept\"><b>오늘은 ‘크롬·구글’을 제대로 쓰는 하루예요.</b> AI가 처음이어도 괜찮게 계정·화면 기본기부터 천천히 갑니다. 크롬 꿀팁으로 시작해 → <b>구글폼</b>으로 자료를 수합하고 → <b>구글시트</b>를 제미나이로 정리·계산하는 흐름이에요. 실습은 <b>제미나이(Gemini)</b> 중심(구글폼·구글시트와 바로 이어져요)이고, 예제는 모두 <b>학교 행정(예산·계약·시설)</b> 상황으로 준비했어요.</div>\n\n<h3 class=\"blk\">📚 교육 내용</h3>\n<div class=\"block open\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">1차시</span><span class=\"block-t\">오늘부터 나도 디지털 에이스</span><span class=\"block-h\">1H</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><ul class=\"block-ul\"><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① 로그인 제대로 하기 — 개인계정 · 기관계정 프로필 분리<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>기본 중의 기본이지만 놓치기 쉬운 부분 — <b>보안</b>과 자료 관리에서 중요합니다</li><li><b>준비물: 개인계정과 기관계정 2개</b>를 미리 준비해 오세요</li><li>크롬 오른쪽 위 <b>프로필 아이콘</b> → <b>‘크롬(Chrome) 프로필 추가’</b>로 계정별 프로필 만들기<img class=\"doc-img\" src=\"login-profile-add.png\" alt=\"크롬 프로필 추가 → 새 Chrome 프로필 설정 화면\" loading=\"lazy\"></li><li>계정별 <b>프로필 사진 변경 / 테마 색상</b>으로 구분 → 어느 계정인지 한눈에<img class=\"doc-img\" src=\"login-taskbar.png\" alt=\"작업표시줄의 개인계정·기관계정 프로필 두 개\" loading=\"lazy\"><a class=\"link-btn faces-btn\" href=\"https://faces.notion.com/\" target=\"_blank\" rel=\"noopener\">🙂 프로필 사진 만들기 (Notion Faces)</a></li><li>계정별 <b>바탕화면 바로가기</b> 만들기 <i>(개인 노트북이 있는 3일차에 진행)</i><img class=\"doc-img\" src=\"login-shortcut.png\" alt=\"프로필 맞춤설정 · 아바타 선택 · 바탕화면 바로가기 만들기 화면\" loading=\"lazy\"></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 초간단 즐겨찾기 + 파비콘 만들기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>미션</b>: 웹교안 · 제미나이 · 내가 자주 가는 사이트를 즐겨찾기 하고 <b>아이콘(파비콘)만</b> 3개 남기기</li><li>주소창 오른쪽 <b>별표(☆)</b>로 즐겨찾기 대신 <b>추파춥스(?)</b> 활용하기!</li><li>북마크에 <b>마우스 우클릭 → 수정 → 이름 지우기</b> → 아이콘(파비콘)만 남아 깔끔하고 빠르게 접속</li></ol><img class=\"doc-img\" src=\"bookmark-favicon.png\" alt=\"즐겨찾기 Before/After — 이름을 지우고 파비콘만 남긴 북마크\" loading=\"lazy\"></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">③ 한방에 큐알코드 만들기 (크롬 / 엣지 다 가능)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>아직도 네이버 큐알 쓰시나요? <b>한방에 큐알코드 만드는 2가지 방법</b></li><li><b>방법 ① 마우스 우클릭</b> — 페이지에서 우클릭 → ‘이 페이지의 QR 코드 만들기’ (크롬·엣지 기본 기능)</li><li><b>방법 ② 크롬 확장 프로그램</b> — QR Code Generator 설치 후 클릭 한 번<br><a class=\"link-btn\" href=\"https://chromewebstore.google.com/detail/qr-code-generator/afpbjjgbdimpioenaedcjgkaigggcdpp\" target=\"_blank\" rel=\"noopener\">🔳 QR Code Generator 설치</a></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④ 캡처, 이렇게 하세요<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>캡처 단축키</b>: <kbd>⊞ Win + Shift + S</kbd> — 또는 더 간단하게 <kbd>PrtSc</kbd><img class=\"doc-img\" src=\"capture-keys.png\" alt=\"캡처 단축키 — 윈도우+Shift+S vs PrtSc\" loading=\"lazy\"></li><li>캡처 <b>도구로 텍스트 복사</b>가 되는 거 아세요? — 캡처한 이미지 속 글자를 바로 복사</li><li>더 편한 방법? → 다음 항목 <b>구글 렌즈</b>로 이어집니다</li></ol></div></li><li class=\"item-detail coll coll-red\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④-1 (＋더 나아가기) 스크롤 캡처·편집이 편한 픽픽(PicPick)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">픽픽은 연수 중 <b>시간이 허락하면 설치해 실습</b>합니다.</div><ol class=\"steps\"><li>① <b>스크롤 캡처</b> — 긴 페이지를 한 장으로 쭉!</li><li>② <b>동영상 녹화</b> 가능</li><li>③ 캡처 이미지에 <b>모자이크 처리 · 번호 순서 자동 매기기</b> 등 다양한 편집 기능</li><li>설치 파일 내려받기 →<br><a class=\"link-btn\" href=\"https://picpick.app/ko/download/\" target=\"_blank\" rel=\"noopener\">🖼️ 픽픽(PicPick) 다운로드</a></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑤ 구글 렌즈 — 화면 속 글자·이미지를 바로 활용 (엣지 X / 크롬 O)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">관련 내용(웹·이미지 등)을 <b>오른쪽 창</b>에서 바로 확인할 수 있어요.<div class=\"img-slot\"><b>🖼️ 구글 렌즈 화면 예시</b>이미지를 주시면 여기에 넣어드릴게요</div></div><ol class=\"steps\"><li><b>① 텍스트 복사</b> — 화면 속 글자를 복사 → <kbd>doc.new</kbd>로 구글 독스를 열어 붙여넣어 잘 됐는지 확인</li><li><b>② 이미지로 복사</b> — 복사한 이미지를 PPT·캔바 등 <b>어디든 붙여넣기</b>(캡처 불필요) → <kbd>slide.new</kbd>로 구글 슬라이드에서 확인</li><li><b>③ 번역</b> — 화면 속 외국어를 바로 번역</li></ol><div class=\"item-note\">💡 <b>구글 렌즈가 안 뜨면?</b> ① 크롬인지 확인(크롬만 됩니다, 엣지 X) · ② ⋮ → 도움말 → Chrome 정보 → 최신으로 업데이트 · ③ 그래도 안 되면 ⋮ → 설정 → 검색엔진을 ‘Google’로</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑥ 모바일 구글 렌즈<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>휴대폰 <b>구글 앱 · 크롬</b>에서 카메라/이미지로 글자·사물·번역을 바로 인식</li><li>현장 사진 속 글자 추출, 실물 번역 등 밖에서도 그대로 활용</li></ol></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑦ 전체 글 가져오기 (복사 허용)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>구글 렌즈는 <b>일부 글만</b> 잡히고 <b>전체 글은 안 긁히는</b> 단점이 있어요</li><li><b>복사 허용(Allow Copy)</b> 확장 프로그램이면 복사가 막힌 사이트에서도 전체 글을 쏙 복사<br><a class=\"link-btn\" href=\"https://chromewebstore.google.com/detail/%EB%B3%B5%EC%82%AC-%ED%97%88%EC%9A%A9-+/ajhbdcgfhlhhmocddefknjjkejcfpbnj?hl=ko\" target=\"_blank\" rel=\"noopener\">📋 복사 허용 설치</a></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑧ 툴바 설정 (분할뷰 · 큐알코드 · 구글 렌즈 등)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>자주 쓰는 기능(분할뷰 · 큐알코드 · 구글 렌즈 등)을 <b>툴바에 꺼내두면</b> 클릭 한 번으로 사용</li><li>설정: 툴바 빈 곳 <b>우클릭 → 도구 모음 맞춤설정</b>(또는 ⋮ 메뉴)에서 원하는 도구 켜기</li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑨ 탭 그룹 활용 (업무별 탭 정리)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>여러 탭을 <b>업무별로 묶어</b> 색·이름으로 정리 — 예: ‘예산’ · ‘시설’ · ‘공문’ 그룹</li><li>만들기: 탭 <b>우클릭 → 새 그룹에 탭 추가</b> → 이름·색 지정</li><li>그룹을 <b>접으면</b> 화면이 깔끔, 다시 누르면 펼쳐져요 (저장 그룹으로 두면 창을 닫아도 유지)</li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑩ 시크릿 모드 vs 게스트 모드<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>시크릿 모드 = ‘나’를 위한 보호</b> — 공용 PC에 내 흔적을 남기고 싶지 않을 때, 내가 만든 웹사이트 확인용</li><li><b>게스트 모드 = ‘남’을 위한 배려</b> — 내 컴퓨터를 학생·동료에게 잠시 빌려줄 때, 내 정보를 전혀 안 보여주고 빌려주기</li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑪ 내 계정 삭제 vs 원격으로 기기 관리<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>상황: “내 컴퓨터가 아닌데 로그인하기가 꺼려져요” / “다른 기기 쓴 뒤 이 기기에서 제 아이디 완전 삭제해주세요”</li><li><b>내 계정 삭제</b>: 브라우저 프로필 → 크롬 프로필 관리 → <b>⋮(삼점)</b> → 삭제</li><li><b>원격으로 기기 관리</b>: 브라우저 프로필 → 구글 계정 관리 → 기기 → <b>로그아웃</b></li></ol></div></li></ul></div></div><div class=\"block\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">2차시</span><span class=\"block-t\">구글폼으로 설문지 1분 완성 — 행정실 설문 만들기</span><span class=\"block-h\">1H</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><ul class=\"block-ul\"><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② AI로 손쉽게 구글폼 만들기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>주소창에 <kbd>form.new</kbd> 입력 → 새 구글폼 바로 열기</li><li><b>AI 모드</b>가 보이나요? 프롬프트 한 줄로 폼을 자동 생성</li><li>안 보이면 워크스페이스 랩스 가입(개인계정만 가능) — 무료 계정도 AI 기능 사용 가능<br><a class=\"link-btn\" href=\"https://workspace.google.com/experiments/\" target=\"_blank\" rel=\"noopener\">🔗 워크스페이스 랩스 가입하기</a></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">③ AI로 디테일한 설문 설계하기 (제미나이 → 구글폼)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">제미나이로 문항을 탄탄히 설계한 뒤 폼으로 옮기는 방법이에요. 아래 프롬프트를 복사해 상황에 맞게 채워 쓰세요.<div class=\"prompt-card\" style=\"margin-top:12px\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">~~~~한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><ol class=\"steps\"><li>제미나이(gemini.google.com)에서 설문 문항 만들기 — 예: “시설 보수요청 설문 문항 만들어줘(사진 첨부 포함)”</li><li>마음에 드는 문항 복사</li><li>구글폼 새 양식에 질문 유형(단답·객관식 등)에 맞춰 옮기기 (또는 <kbd>form.new</kbd>에 붙여넣기)</li><li>‘파일 업로드’ 질문 추가(사진) → 미리보기로 확인</li><li>‘보내기’로 배포</li></ol><div class=\"item-note\">문항을 더 꼼꼼히 다듬을 때 이 방법이 좋아요<div style=\"margin-top:18px;background:#FBF8F0;border:1px solid #E8DFC4;border-left:5px solid #C8A951;border-radius:14px;padding:16px 18px;\"><div style=\"font-weight:800;color:#8A6D1A;font-size:17px;margin-bottom:10px;\">🤖 바로 쓰는 예시 — 교직원 물품·비품 구매 신청 폼</div><div style=\"position:relative;background:linear-gradient(135deg,#16233F,#0F1B2E);border-radius:11px;padding:16px 18px;\"><button class=\"pcopy\" onclick=\"copyPrompt(this)\" style=\"position:absolute;top:12px;right:12px;width:auto;background:#C8A951;color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:14px;font-weight:800;cursor:pointer;\">📋 복사</button><span class=\"prompt-text\" style=\"display:block;color:#E2E8F0;font-size:15px;line-height:1.9;padding-right:64px;\">너는 학교 행정실 업무를 돕는 도우미야. 아래 사양 그대로 &quot;교직원 물품·비품 구매 신청&quot; 구글 설문지를 만들어 줘.<br><br><span style=\"color:#EAD9A0;font-weight:700;\">[폼 제목]</span> 교직원 물품·비품 구매 신청<br><span style=\"color:#EAD9A0;font-weight:700;\">[폼 설명]</span> 구매가 필요한 물품을 신청해 주세요. 접수 후 행정실에서 예산·절차를 검토해 처리합니다.<br><br><span style=\"color:#E8CE7A;font-weight:800;\">[섹션 1 · 신청자 정보]</span><br>1) 신청자 성명 — 단답형, 필수<br>2) 소속(부서/학년) — 드롭다운(교무부, 연구부, 학생부, 1학년, 2학년, 3학년, 행정실, 기타)<br>3) 연락처(내선/휴대전화) — 단답형<br><br><span style=\"color:#E8CE7A;font-weight:800;\">[섹션 2 · 구매 요청 내역]</span><br>4) 품목명 — 단답형, 필수<br>5) 규격·모델·사양 — 단답형<br>6) 수량 — 단답형(숫자만), 필수<br>7) 예상 단가(원) — 단답형(숫자)<br>8) 구매 사유·용도 — 장문형, 필수<br>9) 예산 과목/사업 — 드롭다운(교수학습활동, 학교일반운영, 방과후학교, 교육복지, 잘 모름/기타)<br>10) 희망 납품일 — 날짜<br>11) 긴급 여부 — 객관식(보통 / 긴급)<br>12) 견적서·참고자료 첨부 — 파일 업로드, 선택<br><br><span style=\"color:#E8CE7A;font-weight:800;\">[섹션 3 · 확인]</span><br>13) 부서장 사전 협의 여부 — 객관식(예 / 아니오)<br>14) 기타 요청사항 — 장문형<br><br><span style=\"color:#EAD9A0;font-weight:700;\">[설정]</span> 응답자 이메일 주소 수집 켜기 · 응답을 새 스프레드시트(물품구매 신청 대장)로 연결. 완성 후 편집 링크와 응답 링크를 알려줘.</span></div></div></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① 수동으로 간단하게 만들어 보기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">의견 수합·등록증(사진) 수합, 어떻게 하세요? 이메일로 받으면 시간이 많이 걸려요.</div><ol class=\"steps\"><li><b>이름 · 소속 · 파일 첨부</b>로 아주 간단한 폼 먼저 만들어 보기 <i>(예시: 이수증취합)</i><img class=\"doc-img\" src=\"form-simple.png\" alt=\"구글폼 예시 — 이름·소속·파일 업로드 문항\" loading=\"lazy\"></li><li><b>구글시트 연동</b> — ‘응답’ 탭 → 구글시트로 연결하면 응답이 실시간으로 시트에 쌓이고 자동 집계</li><li><b>응답 폼 공유·확인</b> — ‘보내기’로 링크 공유 후, 시크릿 모드에서 응답자 화면 그대로 확인</li><li><b>응답 모드로 확인</b> — 실제 응답이 어떻게 들어오는지 보기</li><li><b>취합 정보 확인</b> — 파일 업로드 응답은 <b>구글드라이브에 폴더가 자동 생성</b>돼 사진이 착착 정리 <i>(※ 응답자도 구글 로그인 필요)</i></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④ ＋더 나아가 심화 기능<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>① 응답 검증</b> — 전화번호는 숫자만·이메일은 형식 맞게·금액은 숫자만 → 잘못 적어낸 자료 다시 받는 스트레스를 원천 차단</li><li><b>② 조건부 이동(섹션 분기)</b> — 답에 따라 다음 질문이 달라지게 (예: ‘보수 필요? → 예’면 사진·위치 질문이 뜨게)</li><li><b>③ 새로 들어온 최신 기능</b> — 구글폼 <b>응답 기한 설정</b> · 응답자 설정</li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑤ 재사용 · 함께 관리<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>잘 만든 폼은 <b>복사해서 매년 재사용</b></li><li><b>공동 편집자</b>를 추가해 행정실에서 같이 관리 (다시 안 만들어도 돼요)</li></ol></div></li></ul><div class=\"practice\"><b>💻 실습</b>행정실에서 실제 쓸 설문 1개를 만들어 보기 — 이름·소속·<b>파일 첨부(사진)</b> 포함 → 구글시트 연동까지. 예: 시설 보수 사진 접수 · 부서별 예산요구 조사</div><div class=\"tip\"><b>➕ 한 걸음 더</b>완성한 폼은 QR코드로 배포하고, 응답이 오면 자동 알림받게 만들 수도 있어요 → 5일차 자동화에서.</div></div></div><div class=\"block\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">3차시</span><span class=\"block-t\">함수? 그거 AI한테 시키면 되잖아요</span><span class=\"block-h\">1H</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><ul class=\"block-ul\"><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① 시트의 ‘열과 행’만 알아도 70% 성공!<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>열</b> = 세로줄(A·B·C…) / <b>행</b> = 가로줄(1·2·3…), 칸(셀)은 그 교차점 — 예: <b>C5</b></li><li>제미나이에게 시킬 때 “<b>C열</b> 집행률 계산해줘”처럼 열·행으로 콕 짚으면 훨씬 정확해요</li><li>이 감만 잡으면 나머지는 술술 — 오늘의 진짜 기초</li></ol></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 말로 시키는 구글시트 (함수 0개, 다 함께)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>사본 만들기</b> → 내 드라이브에 복사 → 열기<br><a class=\"copy-btn\" style=\"margin:12px 0 10px\" href=\"https://docs.google.com/spreadsheets/d/18_Ic_jNutLMFsE8zwWqcAAXC2iVB1CQZ_HuWpOBnaMo/copy\" target=\"_blank\" rel=\"noopener\">📄 실습 시트 사본 만들기</a><div class=\"cta-desc\">📊 <b>에듀파인에서 다운받은 ‘집행실적현황’ 파일</b></div></li><li><b>원본은 보호!</b> 사본 시트에서 <b>원본 탭 우클릭 → 복제</b> → 이름을 ‘최종변경’으로. 아래 프롬프트는 <b>복제한 탭</b>에서 실행해요.</li><li>시작 전 <b>맨 위 1·2행(제목·빈 줄)을 삭제</b>해 <b>머리글을 1행</b>으로 만들기 <span class=\"game-hint\">(그래야 필터·정렬이 매끄러워요)</span></li><li>아래 <b>‘복사해서 쓰는 프롬프트’</b>를 하나씩 복사해 옆의 제미나이에 붙여넣기 (한 줄씩 천천히!)<div class=\"prompt-inline\"><div class=\"prompt-card\"><span class=\"prompt-num\">1</span><span class=\"prompt-text\">A열부터 M열까지 열 전체를 삭제해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">2</span><span class=\"prompt-text\">머리글에 '코드'가 들어간 열을 모두 삭제해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">3</span><span class=\"prompt-text\">값이 전부 0인 열을 모두 삭제해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">4</span><span class=\"prompt-text\">모든 금액 열에 천 단위 구분 쉼표를 적용해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">5</span><span class=\"prompt-text\">머리글 행에 필터를 걸어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">6</span><span class=\"prompt-text\">원인행위금액 열을 기준으로 오름차순으로 정렬해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">7</span><span class=\"prompt-text\">'원인행위 불용예상액' 열에서 예산이 많이 남은(금액이 큰) 항목과 마이너스(초과 집행)인 항목을 세부사업별로 정리하고, 각 부서에 보낼 예산 사용 안내 문구 초안을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><span class=\"game-hint\">1~3=열 정리 · 4=천원 표시 · 5=필터 · 6=정렬(핵심!) · 7=분석·공지</span></li><li>제미나이가 <b>삭제·정렬을 바로 못 하면</b>: 지울 열은 “열 이름을 알려줘”로 찾아 우클릭 → 삭제, 정렬은 데이터 선택 후 <b>데이터 → 범위 정렬</b>로 직접 하면 돼요</li><li>결과가 어색하면 “고쳐줘” 한마디면 다시 고쳐줘요 (오류 걱정 없이)</li></ol><div class=\"item-note\">예전 <b>예산집행현황</b> 실습(프롬프트 7개)은 맨 아래 ‘📁 참고용 실습’에서 볼 수 있어요</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">③ 한 걸음 더 — 부서 예산요구 양식 만들기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">정리한 표(A~Q)를 <b>부서가 직접 채우는 예산 요구 양식</b>으로! 기존 데이터는 못 건드리게 <b>범위 보호</b>하고, 요구액·담 일정이 담긴 <b>공문·안내문 이미지를 캡처</b>해서 제미나이에 올리고 <b>“이 일정을 내 캘린더에 등록해줘”</b>라고 하면, AI가 글자를 읽어 <b>날짜·시간·장소까지 자동 등록</b>해요. 아래 토글을 눌러 실습용 일정 공문을 열고, 캡처해서 제미나이에 넣어보세요.</div><div class=\"prompt-card\" style=\"margin-top:12px\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">이 이미지는 우리 연수 일정 공문이야. 각 회차의 날짜·시간·장소·주제를 읽어서 내 구글 캘린더에 일정으로 등록해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div style=\"margin-top:12px; background:#F8F9FA; border-radius:12px; overflow:hidden; border:1px solid #E8EAED;\"><button onclick=\"toggleShortcutImg(this)\" style=\"width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; background:transparent; border:none; padding:14px 16px; font-size:18px; font-weight:700; color:#202124; cursor:pointer; font-family:inherit;\"><span>🖼️ 실습용 일정 공문 이미지 보기</span><span class=\"toggle-arrow\" style=\"transition:transform .25s; color:#5F6368;\">▼</span></button><div class=\"shortcut-img-wrap\" style=\"display:none; padding:0 16px 16px;\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCAPuA4QDASIAAhEBAxEB/8QAHQABAAICAwEBAAAAAAAAAAAAAAYHBQgBAwQCCf/EAGkQAAAFAwIBBwYGDQYKBwUECwABAgMEBQYRBxIhCBMUMUFRVhYXIpXS0xUyYXGRlBgjM1JTVFVXgZOWpNE3OEJ1drEJJDRicnShs7S1JTZDRoKywzVEY8HUGSZYZJKiwig54UVHc4Pw/8QAGwEBAQEBAQEBAQAAAAAAAAAAAAECAwUEBgf/xAA9EQACAQEFBQQIBgMAAQUBAAAAARECAxIhMfAEQVFhoXGxwdETFCIjJGKBkQUVMlJT4TNC8QY0coKywpL/2gAMAwEAAhEDEQA/AN/gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA rompt-num\">✎</span><span class=\"prompt-text\">민원 접수용 웹페이지 만들어줘. 이름·연락처·내용 입력칸과 제출 버튼, 깔끔한 디자인으로.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><ol class=\"steps\"><li>제미나이/챗지피티의 <b>캔버스(Canvas)</b> 기능 열기</li><li>만들고 싶은 걸 <b>구체적으로</b> 요청 → 미리보기 확인</li><li>“여기 색 바꿔줘 / 버튼 키워줘”처럼 <b>말로 수정</b></li><li>완성되면 <b>배포(공유 링크·QR)</b> → 바로 사용</li></ol><div class=\"item-note\">예: 민원 접수 폼 · 좌석 배치도 · 간단 예산 계산기 · 행사 안내 페이지</div></div></li></ul><div class=\"practice\"><b>💻 실습</b>우리 업무에 쓸 <b>웹앱 1개</b>를 바이브코딩으로 만들어 보기 (예: 신청 폼, 안내 페이지)</div><div class=\"tip\"><b>➕ 한 걸음 더</b>오늘 만든 웹앱은 5일차 자동화·아카이빙과 연결하면 진짜 ‘나만의 행정 시스템’이 돼요.</div></div></div>\n"}, "blobs": {"3": {"day": {"salt": "PM8Ve41z4S5p6qpifD2YIQ==", "iv": "IegCQVu5VqlNyZ9d", "ct": "KBroJUaMxZZVmI00MjWmc7KglDk2EvmgsdLERqR0QTnR+4Cxx8/zVcImN1eWxRfTBioa4M+iQNfkPjJR6vTNH8oKahGrsDbt6gUGn3tz41NKt74h03D8ydddkoFKPd6CvxUc/g7+rMZKTwjrZpgvwoZjOYXDaJ22a4YIDoT0UUhydwvZnwkdU1XTyVWqFmLQen72WHJ8xz7xi1NvCvJ+ILUyNZpI+ttoJbLmNDb3GZfcIIPfM00pFvjvfPvM2dvV34XhHhodh+OT4y2MOtpoj2i/1CF3kycZIMsY/Ayxp7jtaWV1UbySDSyCjH6sZp82eSjec7PrJeU7EyMDf5rmqGh/acfkkfVSUV6Phk1PxZtWw54GknMjpd+jkDFBXfqunRNwtB1aPrPx6bzv1YPQqiKawFHGvvXxWCSewVpp2JzxDMzg4LISrkzPgOo8h6jkmCPyGlfH7lAjJFebGz7Du4lctkZcRTCLjDhwgJGb+2WzRIAmA6aI2JcLRdLQHlvvOWJgQpaP6nD9HQ/SHUJSO7JkqY2BNd+UFViyouAKeeONF8mHAlmIPk/tFO8xNUMG74UrPedNMrSThqORipEcLNL4IgQu8jdsaEZMbga+RliNpMldmn/xi7s/T0NOa30GcGrprnRMBZdF3fRs12O4rPh9NfjoGPVczwNm7KpnrnB6PdynmoWYJ4Au22ryknF8q3Ic9L8TVX45VpM3oQwX9kx2KqanGFXgOVWCvyZg6Z55YlQFkBJ456MrsbMqu88oonWftPW7AmxXks00mVTNGo8c0ApDq9WRZLqePmBI5b4lKVea41Sk08HaGL2uy2i8kLpJh5ItXq8P2BCj2iqej2tMp+OhOJVSx5UfCtxGoiDU4sEe09XUk/0N1rta6IqFW8mrs9zdmVUZnvVsRaoKBLXQ3EYpbUUOAFzI8jqaXHW5/v5+Y+m+cKgDV+/zWRjQWzPNHwJ/VrB50Wwl+LrHm15Zwzr69vAKG+yDWls2UDqNawX21zMSr5Kf9don6nzHDgnHHP1T5XgR/ULHJ8wTIM/En58Fp3YLyzFrBXIeSikK7zdXJg0H+tm1hy75Ac2sUEFVWw0iqzTQBKuQQvLAMytc8NthhDM68sGLjNhf6QPCu+X/v2IafTAsFb8bDfVC537HmONAFUTeb7F9FYZvoMBx9LNzxyJwBAKsBn6TpZXu8JecZxNpgK8K/79yIuMGdIQ6jbdx0LW7gkYvGE7Kv 릭 한 번으로 불러쓸 수 있어요. (＋ 기능 추가로 새 스킬 만들기)</div></div>\n<div class=\"gem-note\">🔗 <b>이게 왜 좋냐면</b> — Gem에 PDF를 첨부하는 것과 함께, 이미 크롬에 열려 있는 PDF는 바로 질문하면 돼요. 자료를 받아 화면에 띄워두고 물어보는 흐름이 가장 빠릅니다.</div>\n\n<div class=\"gift-closing\"><div class=\"gc-icon\">🌱</div><b>오늘 연수 정말 수고 많으셨습니다!</b><br>현장에서 막히는 부분이 생기면 언제든 편하게 연락 주세요. 함께 해결해 드리겠습니다. 😊</div>", "insHtml": "<div class=\"instructor\"><div class=\"ins-banner\"><div class=\"ins-kicker\">INSTRUCTOR · 강사</div><div class=\"ins-name\">이애진 <span>Lee Ae-jin</span></div><div class=\"ins-chips\"><span class=\"ins-chip\">구글 공식 PD 파트너사 · <b>FlowDX 대표</b></span><span class=\"ins-chip\">구글 공식 트레이너 (Google Certified Trainer)</span><span class=\"ins-chip\">🎓 서울대학교 정보문화학(ICT)</span></div><div class=\"ins-div\"></div><div class=\"ins-contact\"><a class=\"ins-pill\" href=\"https://flowdx.kr\" target=\"_blank\" rel=\"noopener\">🌐 flowdx.kr</a><a class=\"ins-pill\" href=\"mailto:ai@flowdx.kr\">✉ ai@flowdx.kr</a><a class=\"ins-pill\" href=\"tel:01023198419\">☎ 010-2319-8419</a><a class=\"ins-pill ins-cta\" href=\"https://capable-tarsier-97affe.netlify.app/\" target=\"_blank\" rel=\"noopener\">🔗 프로필 보기</a></div></div><button class=\"ins-toggle\" onclick=\"this.closest('.instructor').classList.toggle('open')\"><span class=\"ins-plus\">+</span> 강사 상세 이력 보기<span class=\"ins-tag\">학력 · 경력 · 저서</span></button><div class=\"ins-more\"><div class=\"ins-grid\"><div class=\"ins-col\"><h4>🎓 학력 · 자격</h4><ul><li>서울대학교 정보문화학(ICT)</li><li>Google Certified Trainer (구글 공식 트레이너)</li><li>Gemini Certified Educator (제미나이 에듀케이터)</li><li>ADsP · 데이터 분석 준전문가</li></ul></div><div class=\"ins-col\"><h4>📰 언론 보도 · 공식 성과</h4><ul><li>중앙뉴스타임스(2025.11) · 인천시교육청 교육연수원 직무연수</li><li>인천광역시교육청(2025.12) · 초·중등 교실수업혁명 직무연수 운영</li><li>미디어투데이(2025.07) · 파주교육지원청 AI 소통 역량 강화·실무 적용</li></ul></div><div class=\"ins-col ins-wide\"><h4>🏫 교육 · 행정 혁신 주요 경력</h4><ul><li>구글 코리아 <b>제미나이 아카데미 주강사</b></li><li>전국 학교장·교감 대상 <b>AI 리터러시 리더십 연수 200회+</b></li><li>대학 교직원·교수·학생 대상 AI 행정 혁신 연수</li><li>경기도교육연구원 박사급 연구원 대상 정책연구 AI 활용 연수</li><li>5~9급 교육행정직 공무원 <b>AI 정책보고서 연수</b></li><li>한국과학창의재단 ‘찾아가는 학교컨설팅’ 코디네이터·주강사</li><li>대원외고 등 특목고 AI 연수 및 영재교육연구소 강사 양성 연수</li></ul></div><div class=\"ins-col\"><h4>💼 산업 현장 실무</h4><ul><li><b>FlowDX 대표</b> — AI 비즈니스 모델링·공공기관 DX 전환 컨설팅 총괄</li><li>Ebay·G마켓·옥션 해외 플랫폼 개발 프로젝트 기획 참여</li><li>Nexon·Ebay 등 글로벌 기업 주요 프로젝트 기획·개발</li></ul></div><div class=\"ins-col\"><h4>📚 주요 저서</h4><ul><li>『HTML, CSS, JavaScript를 배우는 마법코딩학교』</li><li>『AI시대, 보고서가 당신의 무기가 된다』</li><li>『AI 기반 문화콘텐츠 기획』</li></ul></div></div></div></div>", "warmup": "<h2 class=\"s-title\">🔥 워밍업 게임</h2><p class=\"s-sub\">본격 시작 전, 가볍게 손을 푸는 시간! 게임 카드를 <b>뒤집어</b> 단축키를 재미있게 익혀요.</p><div class=\"game-intro\">🏆 <b>도전 모드</b>에서 5개를 가장 빨리 끝낸 분은 강사에게 화면을 보여주세요 — 작은 선물이 기다려요! 🎁</div><div class=\"game-flip\"><div class=\"game-cover cov1\" onclick=\"this.parentElement.classList.add('flipped')\"><div class=\"cover-badge\">GAME 1</div><div class=\"cover-emoji\">📋</div><div class=\"cover-title\">복사 &amp; 붙여넣기</div><div class=\"cover-hint\">👆 카드를 뒤집어 시작!</div></div><div class=\"game-content\"><div class=\"game arcade\"><div class=\"arcade-top\"><span class=\"arcade-badge\">GAME 1</span><span class=\"arcade-title\">복사 &amp; 붙여넣기</span><span class=\"arcade-keys\"><kbd>Ctrl</kbd>+<kbd>C</kbd> · <kbd>Ctrl</kbd>+<kbd>V</kbd> · <kbd>Ctrl</kbd>+<kbd>A</kbd></span></div><div class=\"level-row\"><button class=\"level-btn active\" onclick=\"g1level(this,1)\">🟢 레벨 1 · 한 문장 복붙</button><button class=\"level-btn\" onclick=\"g1level(this,2)\">🔵 레벨 2 · Ctrl+A 콤보</button></div><p class=\"game-desc\" id=\"g1desc\">문장을 <b>드래그 → Ctrl+C</b>로 복사하고, 칸을 클릭해 <b>Ctrl+V</b>! <b>5문제</b> 완성 🏁</p><div class=\"mode-row\"><button class=\"mode-btn active\" onclick=\"g1mode(this,'practice')\">😌 연습</button><button class=\"mode-btn\" onclick=\"g1mode(this,'challenge')\">⏱️ 도전</button></div><div class=\"stage-row\"><span class=\"dots\" id=\"g1dots\"></span><span class=\"stage-label\" id=\"g1p\">STAGE 1 / 5</span></div><div class=\"g1-target\" id=\"g1t\">복사할 문장이 여기에!</div><textarea class=\"g1-src\" id=\"g1src\" spellcheck=\"false\" oninput=\"g1srcinput()\"></textarea><button class=\"game-start hidden\" id=\"g1s\" onclick=\"g1start()\">🚩 5단계 도전 시작!</button><input class=\"game-input\" id=\"g1i\" placeholder=\"여기 클릭 → Ctrl+V로 붙여넣기\" onpaste=\"g1paste(event)\"><div class=\"game-result\" id=\"g1r\"></div><div class=\"best\" id=\"g1b\"></div></div></div></div><div class=\"game-flip\"><div class=\"game-cover cov2\" onclick=\"this.parentElement.classList.add('flipped')\"><div class=\"cover-badge\">GAME 2</div><div class=\"cover-emoji\">📸</div><div class=\"cover-title\">화면 캡처</div><div class=\"cover-hint\">👆 카드를 뒤집어 시작!</div></div><div class=\"game-content\"><div class=\"game arcade\"><div class=\"arcade-top\"><span class=\"arcade-badge\">GAME 2</span><span class=\"arcade-title\">화면 캡처</span><span class=\"arcade-keys\"><kbd>⊞Win</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> · <kbd>PrtSc</kbd></span></div><p class=\"game-desc\">아래 <b>이모지</b>를 <b>Win+Shift+S</b>(부분) 또는 <b>PrtSc</b>(전체)로 캡처한 뒤, 칸에 <b>Ctrl+V</b>! 이모지가 바뀌며 <b>5장</b> 도전 📸 <span class=\"game-hint\">캡처 키는 브라우저가 못 봐서, 붙여넣기까지 해야 성공!</span></p><img class=\"doc-img gkeys\" src=\"capture-keys.png\" alt=\"캡처 단축키 — 윈도우+Shift+S vs PrtSc\" loading=\"lazy\"><div class=\"mode-row\"><button class=\"mode-btn active\" onclick=\"g2mode(this,'practice')\">😌 연습</button><button class=\"mode-btn\" onclick=\"g2mode(this,'challenge')\">⏱️ 도전</button></div><div class=\"stage-row\"><span class=\"dots\" id=\"g2dots\"></span><span class=\"stage-label\" id=\"g2p\">STAGE 1 / 5</span></div><div class=\"cap-card cap-emoji-only\"><div class=\"cap-emoji\" id=\"g2emoji\">🌏</div></div><button class=\"game-start hidden\" id=\"g2s\" onclick=\"g2start()\">🚩 5장 도전 시작!</button><div class=\"paste-zone\" id=\"g2z\" contenteditable=\"true\" onpaste=\"g2paste(event)\">여기 클릭 → 캡처 이미지 Ctrl+V</div><div class=\"game-result\" id=\"g2r\"></div><div class=\"best\" id=\"g2b\"></div></div></div></div>", "setup": "<h2 class=\"s-title\">🛠️ 시작 전 환경 세팅</h2><p class=\"s-sub\">연수 전에 미리 준비하세요 — 크롬 · 구글계정 + 3주차 노트북(윈도우11) 체크업.</p><p class=\"setup-intro\">연수를 매끄럽게 진행하려면 <b>크롬 브라우저</b>와 <b>구글 개인계정</b>이 필요합니다. 아래 <b>5단계</b>를 미리 준비해 주세요.</p><div class=\"step\"><div class=\"step-badge\">STEP 1</div><div class=\"step-title\">크롬 브라우저가 없다면? 크롬 설치!</div><a class=\"link-btn\" href=\"https://www.google.com/chrome/\" target=\"_blank\" rel=\"noopener\">⬇️ 크롬 설치하기</a><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">크롬 설치 방법 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>브라우저는 인터넷을 여는 창입니다. 대표적으로 크롬(Chrome)과 엣지(Edge)가 있어요. 이 연수에서는 구글 AI인 <b>제미나이와 가장 잘 맞는 크롬</b>을 사용합니다. 이 과정은 크롬(Chrome) 기준으로 진행합니다.</p><ul><li>위 ‘크롬 설치하기’ 버튼을 누릅니다</li><li>Chrome 다운로드 → 설치 파일 실행</li><li>설치가 끝나면 크롬을 <b>기본 브라우저</b>로 설정</li></ul><div class=\"img-slot\"><b>🖼️ 크롬 설치 화면</b>이미지를 주시면 여기에 넣어드릴게요</div></div></div><div class=\"step\"><div class=\"step-badge\">STEP 2</div><div class=\"step-title\">구글 개인계정이 생각이 안 난다면? 비밀번호 찾기</div><p class=\"step-lead\">이미 구글 계정이 있는 분은 새로 만들 필요가 없습니다. 연수 전, 구글 개인계정과 비밀번호를 꼭 준비해 주세요. “내 계정이 있었나? 비밀번호가 뭐였지?” 싶다면 아래 방법으로 찾으면 됩니다.</p><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">계정·비밀번호 찾는 방법 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>아래 문서에서 계정·비밀번호 찾는 방법을 바로 볼 수 있어요. ※ 문서가 안 보이면 <a href=\"https://docs.google.com/document/d/15QHT-cQos4FD31cncyhzexmc9Ofkiwuy4MsUeqsOtH0/edit?tab=t.0\" target=\"_blank\" rel=\"noopener\">여기</a>를 눌러 새 창으로 열어 주세요.</p><iframe class=\"doc-embed\" src=\"https://docs.google.com/document/d/15QHT-cQos4FD31cncyhzexmc9Ofkiwuy4MsUeqsOtH0/preview\" loading=\"lazy\" title=\"계정·비밀번호 찾기 문서\"></iframe></div></div><div class=\"step step-red\"><div class=\"step-badge\">STEP 3</div><div class=\"step-title\">구글계정이 없다면? 구글계정 만들기</div><a class=\"link-btn\" href=\"https://accounts.google.com/signup\" target=\"_blank\" rel=\"noopener\">✏️ 구글 가입하기</a><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">가입 방법 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>구글 계정이 아예 없다면 새로 만듭니다. <b>학교·기관 계정이 아닌 개인 계정</b>으로 만드는 것이 중요해요.</p><ul><li>위 ‘구글 가입하기’ 버튼 클릭</li><li>이름 → 생년월일·성별 → 원하는 아이디(이메일) 입력</li><li>비밀번호 설정 후 휴대폰 본인인증 → 가입 완료</li><li>만든 아이디와 비밀번호를 꼭 <b>메모</b>해 둡니다</li></ul><div class=\"warn\">📱 가입 중 <b>‘보안문자 · 인증코드’</b> 단계가 나오면 본인 <b>휴대폰으로 SMS 인증</b>이 필요해요 — 휴대폰을 꼭 준비하세요. <b>한 전화번호로는 계정을 몇 개까지만</b> 인증돼서 강사 번호로 여러 개는 만들 수 없어요. 인증이 막히면 아래 <b>STEP 4 임시계정</b>을 쓰시면 됩니다. (가능하면 <b>연수 전 집에서 미리</b> 만들어 오시길 권장!)</div><div class=\"warn\">⚠️ 가입 시 입력한 아이디(이메일)와 비밀번호는 앞으로 <b>AI 로그인에 계속</b> 쓰입니다. 잊지 않도록 적어 두세요.</div></div></div><div class=\"step\"><div class=\"step-badge\">STEP 4</div><div class=\"step-title\">오늘만 사용하실 임시 구글계정 공유</div><p class=\"step-lead\">구글 계정 준비가 어려우시면, 아래 시트에서 오늘만 사용하는 임시 계정을 받아 쓰세요.</p><a class=\"link-btn\" href=\"https://docs.google.com/spreadsheets/d/16Ejg7lC9iv8r4w_Ljrz6BFD9gmMAhJOgXHiwb7i1PH0/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\">📄 임시 구글계정 시트 열기</a> <span class=\"click-here\">👈 여기를 클릭!</span><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">임시계정 사용 방법 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>※ 화면에서 바로 보이지 않으면 위 ‘시트 열기’ 버튼으로 열어 주세요. (이름 작성은 시트를 직접 열어야 가능합니다.)</p><ul><li>시트의 <b>C열</b>에 본인 이름(또는 닉네임)을 적습니다.</li><li>그 줄의 아이디·비밀번호로 로그인해 사용합니다.</li></ul><div class=\"warn\">⚠️ 이 계정은 <b>기관 계정</b>이라, AI 활용 시 개인계정과 달리 일부 기능이 막힐 수 있습니다. 가능하면 <b>개인 구글계정</b> 사용을 권장합니다.</div><div class=\"img-slot\"><b>🖼️ 임시계정 시트 화면</b>이미지를 주시면 여기에 넣어드릴게요</div></div><iframe class=\"sheet-embed\" src=\"https://docs.google.com/spreadsheets/d/16Ejg7lC9iv8r4w_Ljrz6BFD9gmMAhJOgXHiwb7i1PH0/preview?gid=0\" loading=\"lazy\" title=\"임시 구글계정 시트\"></iframe><p class=\"embed-note\">👀 아래에서 계정을 바로 확인할 수 있어요. <b>이름 작성·로그인은 위 ‘시트 열기’ 버튼</b>으로 직접 열어야 가능합니다.</p></div><div class=\"step\"><div class=\"step-badge\">STEP 5</div><div class=\"step-title\">🖥️ 3주차 노트북 준비 — 윈도우 11 · 크롬 확인</div><p class=\"step-lead\"><b>3주차(3일차)</b>에는 <b>개인 노트북</b>을 가져오세요. 원활한 실습을 위해 아래 <b>2가지</b>를 미리 확인해 주세요.</p><div class=\"check-list\"><div class=\"check-item\">✅ <b>윈도우 11</b>로 업데이트되어 있나요?</div><div class=\"check-item\">✅ <b>크롬 브라우저</b>가 설치되어 있나요? <span class=\"game-hint\">(STEP 1 참고)</span></div></div><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">윈도우 11 업데이트 방법 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p><b>① 내 윈도우 버전 확인</b> — <kbd>⊞Win</kbd>+<kbd>R</kbd> → <b>winver</b> 입력 → Enter. (또는 설정 → 시스템 → 정보)</p><p><b>② 윈도우 11로 업데이트</b> (윈도우 10이라면)</p><ul><li><kbd>⊞Win</kbd>+<kbd>I</kbd>로 <b>설정</b> → <b>업데이트 및 보안 → Windows 업데이트</b></li><li><b>업데이트 확인</b> → “Windows 11로 업그레이드” 안내가 뜨면 <b>다운로드 및 설치</b></li><li>안내가 없으면 <b>Windows 11 설치 도우미</b> 이용 → <a href=\"https://www.microsoft.com/software-download/windows11\" target=\"_blank\" rel=\"noopener\">microsoft.com/software-download/windows11</a></li><li>업데이트는 시간이 걸리니 <b>전원 연결 + 넉넉한 시간</b>에 미리 진행하세요</li></ul><div class=\"warn\">⚠️ PC 사양(TPM 2.0 · 지원 CPU 등)이 안 되면 윈도우 11 업데이트가 <b>불가</b>할 수 있어요. 그런 경우 윈도우 10 그대로 오셔도 되지만, <b>연수 전에 미리 알려</b> 주세요.</div><div class=\"img-slot\"><b>🖼️ 윈도우 업데이트 화면</b>이미지를 주시면 여기에 넣어드릴게요</div></div></div>"};
const unlocked={};for(var _k in P.open){unlocked[_k]=P.open[_k];}
let master=null;
function b64(b){const s=atob(b);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function dec(blob,pw){
 const salt=b64(blob.salt),iv=b64(blob.iv),ct=b64(blob.ct);
 const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:P.iter,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));
}
function isOpen(no){return unlocked[String(no)]!==undefined;}
function buildTabs(){
 let h='<button class="tab" data-tab="home" onclick="showTab(\'home\')">🏠 홈</button>';
 h+='<button class="tab tab-setup" data-tab="setup" onclick="showTab(\'setup\')">🛠️ 시작 전 세팅</button>';
 h+='<button class="tab tab-warmup" data-tab="warmup" onclick="showTab(\'warmup\')">🔥 워밍업 게임</button>';
 P.meta.forEach(m=>{h+='<button class="tab" data-tab="'+m.no+'" onclick="showTab(\''+m.no+'\')">'+m.no+'일차<span class="tab-date">'+m.date+'</span></button>';});
 h+='<button class="tab tab-gift" data-tab="gift" onclick="showTab(\'gift\')">🎁 선물</button>';
 document.getElementById('tabs').innerHTML=h;
}
function renderHome(){
 let cards='';
 P.meta.forEach(m=>{const open=isOpen(m.no)||master!==null;
  cards+='<div class="day-card d'+m.no+' '+(open?'':'locked')+'" onclick="showTab(\''+m.no+'\')">'+
   '<div class="dc-top"><span class="dc-no">'+m.no+'일차</span><span class="dc-date">'+m.date+' ('+m.dow+')</span></div>'+
   '<div class="dc-title">'+m.title+'</div><div class="dc-sub">'+m.subtitle+'</div>'+
   '<span class="dc-badge '+(open?'badge-open':'badge-lock')+'">'+(open?'🔓 열림':'🔒 잠김')+'</span></div>';});
 cards+='<div class="day-card dgift" onclick="showTab(\'gift\')">'+
   '<div class="dc-top"><span class="dc-no">🎁 선물</span><span class="dc-date">보너스</span></div>'+
   '<div class="dc-title">작은 선물들</div>'+
   '<div class="dc-sub">크롬 단축키 · 유용한 사이트 · 확장 프로그램 · 크롬 속 제미나이</div>'+
   '<span class="dc-badge badge-open">🔓 열림</span></div>';
 return P.insHtml+
  '<h2 class="s-title">전체 일정 · 일차를 선택하세요</h2>'+
  '<div class="home-lead"><b>3시간 × 5일차</b> 과정입니다. 아래에서 일차를 고르면 들어갑니다. '+
  '<b>1일차는 열려 있고</b>, 2~5일차는 제목만 보이며 그날 강사가 안내하는 <b>비밀번호</b>로 열립니다.</div>'+
  '<div class="day-grid">'+cards+'</div>'+
  '<div style="margin-top:44px;">'+
   '<h2 class="s-title">📌 과정 안내 패들렛</h2>'+
   '<div class="home-lead">연수 전체 안내를 패들렛에서도 한눈에 볼 수 있어요. 아래에서 바로 보거나, 새 창에서 크게 열어보세요.</div>'+
   '<a class="link-btn" href="https://padlet.com/doramge1984/ai-2026-ai-11yr2jh7osuxvodg" target="_blank" rel="noopener" style="margin:4px 0 14px;">🧱 패들렛 새 창에서 크게 열기 →</a>'+
   '<iframe class="padlet-embed" src="https://padlet.com/embed/11yr2jh7osuxvodg" loading="lazy" title="AI 연수 안내 패들렛" allow="clipboard-write" style="height:640px;"></iframe>'+
  '</div>';
}
async function renderDay(no){
 const panel=document.getElementById('panel');
 const back='<span class="backhome" onclick="showTab(\'home\')">← 홈으로</span>';
 if(isOpen(no)){panel.innerHTML=back+unlocked[String(no)];return;}
 if(master!==null){try{unlocked[String(no)]=await dec(P.blobs[String(no)].master,master);panel.innerHTML=back+unlocked[String(no)];return;}catch(e){}}
 const m=P.meta.find(x=>x.no==no);
 panel.innerHTML=back+'<div class="lock-screen"><div class="big">🔒</div>'+
  '<h2>'+no+'일차 · '+m.title+'</h2><p>강사가 안내하는 <b>이번 일차 비밀번호</b>를 입력하면 열립니다.</p>'+
  '<div class="pw-row"><input id="pwi" type="password" placeholder="비밀번호" autocomplete="off" '+
  'onkeydown="if(event.key===\'Enter\')unlock('+no+')"><button onclick="unlock('+no+')">열기</button></div>'+
  '<div class="pw-err" id="pwe"></div></div>';
 setTimeout(()=>{const el=document.getElementById('pwi');if(el)el.focus();},50);
}
async function unlock(no){
 const inp=document.getElementById('pwi'),err=document.getElementById('pwe');
 const pw=inp.value.trim();if(!pw){err.textContent='비밀번호를 입력하세요.';return;}
 err.textContent='여는 중...';const b=P.blobs[String(no)];let plain=null,isM=false;
 try{plain=await dec(b.day,pw);}catch(e){}
 if(plain===null){try{plain=await dec(b.master,pw);isM=true;}catch(e){}}
 if(plain===null){err.textContent='비밀번호가 맞지 않습니다.';return;}
 unlocked[String(no)]=plain;if(isM)master=pw;renderDay(no);
}
function showTab(tab){
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===String(tab)));
 const panel=document.getElementById('panel');
 if(tab==='home'){panel.innerHTML=renderHome();}
 else if(tab==='gift'){panel.innerHTML='<span class="backhome" onclick="showTab(\'home\')">← 홈으로</span>'+P.gift;}
 else if(tab==='setup'){panel.innerHTML='<span class="backhome" onclick="showTab(\'home\')">← 홈으로</span>'+P.setup;}
 else if(tab==='warmup'){panel.innerHTML='<span class="backhome" onclick="showTab(\'home\')">← 홈으로</span>'+P.warmup;initWarmup();}
 else{renderDay(tab);}
}

   var d1=findBlock('디지털 에이스');var d2=document.querySelector('.cal-embed');var d3=findBlock('할루시네이션');var d4=findBlock('프리미엄 열기');var d5=findBlock('마이클');var sig=d1?'d1':(d2?'d2':(d3?'d3':(d4?'d4':(d5?'d5':''))));
   if(!sig){removeSide();return;}
   var ex=document.getElementById('cal-side');if(ex&&ex.dataset.sig===sig)return;if(ex)ex.remove();
   var side=document.createElement('div');side.id='cal-side';side.className='cal-side';side.dataset.sig=sig;var h='';
   if(sig==='d1'){h='<div class="cs-title">✦ 1일차 목차 ✦</div>';var cnt=0;D1.forEach(function(g){var blk=findBlock(g[1]);if(!blk)return;h+='<div class="cs-grp">'+g[0]+'</div>';g[2].forEach(function(it){var el=[].slice.call(blk.querySelectorAll('.item-detail.coll')).find(function(d){var lb=d.querySelector('.item-label');return lb&&lb.textContent.indexOf(it[0])>=0;});if(el){if(!el.id)el.id='d1-'+(cnt++);h+='<a class="cs-a" data-w="'+el.id+'">'+it[1]+'</a>';}});});}
   else if(sig==='d3'){h='<div class="cs-title">✦ 3일차 목차 ✦</div>';D3.forEach(function(g){h+='<div class="cs-grp">'+g[0]+'</div>';g[1].forEach(function(it){h+='<a class="cs-a" data-w="'+it[1]+'">'+it[0]+'</a>';});});}
   else if(sig==='d4'){h='<div class="cs-title">✦ 4일차 목차 ✦</div>';D4.forEach(function(g){h+='<div class="cs-grp">'+g[0]+'</div>';g[1].forEach(function(it){h+='<a class="cs-a" data-w="'+it[1]+'">'+it[0]+'</a>';});});}
   else if(sig==='d5'){h='<div class="cs-title">✦ 5일차 목차 ✦</div>';D5.forEach(function(g){h+='<div class="cs-grp">'+g[0]+'</div>';g[1].forEach(function(it){h+='<a class="cs-a" data-w="'+it[1]+'">'+it[0]+'</a>';});});}
   else{h='<div class="cs-title">✦ 2일차 목차 ✦</div><div class="cs-grp">1차시 · 캘린더</div>';SEC2.forEach(function(s){h+='<a class="cs-a" data-t="'+s[0]+'">'+s[1]+'</a>';});h+='<div class="cs-grp">2차시 · 웹앱</div>';var blk2=findBlock('웹앱');if(blk2){[].slice.call(blk2.querySelectorAll('.item-detail.coll')).forEach(function(it,i){var lb=it.querySelector('.item-label');if(!lb)return;if(!it.id)it.id='wa2-'+i;var txt=lb.textContent.trim().replace(/\s+/g,' ');if(txt.length>17)txt=txt.slice(0,16)+'…';h+='<a class="cs-a" data-w="'+it.id+'">🧩 '+txt+'</a>';});}}
   side.innerHTML=h;document.body.appendChild(side);
   side.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var tid=a.getAttribute('data-t');if(tid){var el=document.getElementById(tid);if(el){openSec(el);el.scrollIntoView({behavior:'smooth',block:'start'});}return;}var wid=a.getAttribute('data-w');if(wid){var it=document.getElementById(wid);if(it){var blk=it.closest('.block');if(blk&&!blk.classList.contains('open')){var bh=blk.querySelector('.block-head');if(bh)bh.click();}if(!it.classList.contains('open'))it.classList.add('open');setTimeout(function(){it.scrollIntoView({behavior:'smooth',block:'start'});},150);}}});
   spy();
 }
 setInterval(function(){collapseCal();build();},500);
 window.addEventListener('scroll',function(){if(document.getElementById('cal-side'))spy();},{passive:true});
})();

buildTabs();showTab('home');
</script></body></html>
